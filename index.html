<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFLA &amp; WCA | Strategi Optimasi Komputasi Awan - ITS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2303132b'/%3E%3Ccircle cx='32' cy='32' r='21' fill='none' stroke='%23127bbe' stroke-width='6' stroke-dasharray='8 5'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23fdbb16'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body data-chapter="pembuka">
  <!-- Panggung tetap 1920x1080 yang diskalakan agar pas di layar apa pun -->
  <div id="deck" class="deck">
    <main id="deck-stage" class="deck-stage"></main>

    <div id="chapter-wipe" class="chapter-wipe" aria-hidden="true"></div>

    <footer class="deck-bar">
      <button type="button" class="bar-btn" id="btn-prev" aria-label="Sebelumnya" title="Sebelumnya (&larr;)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </button>
      <nav id="deck-rail" class="deck-rail" aria-label="Progres presentasi"></nav>
      <span id="deck-counter" class="deck-counter"></span>
      <button type="button" class="bar-btn" id="btn-notes" aria-pressed="false" title="Catatan presenter (N)">Catatan</button>
      <button type="button" class="bar-btn" id="btn-help" title="Pintasan keyboard (?)">?</button>
      <button type="button" class="bar-btn" id="btn-fullscreen" aria-label="Layar penuh" title="Layar penuh (F)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>
      <button type="button" class="bar-btn bar-btn-next" id="btn-next" aria-label="Berikutnya" title="Berikutnya (&rarr;)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 5 16 12 9 19"></polyline></svg>
      </button>
    </footer>

    <aside id="presenter-notes" class="notes hidden" aria-label="Catatan presenter">
      <div class="notes-head">
        <h2 id="notes-title"></h2>
        <button type="button" class="close-btn" id="btn-close-notes" aria-label="Tutup catatan">&times;</button>
      </div>
      <div id="notes-content" class="notes-body"></div>
    </aside>

    <div id="shortcuts-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Pintasan keyboard">
      <div class="modal-panel">
        <div class="notes-head">
          <h2>Pintasan keyboard</h2>
          <button type="button" class="close-btn" id="btn-close-help" aria-label="Tutup pintasan">&times;</button>
        </div>
        <dl class="shortcuts">
          <dt><kbd>&rarr;</kbd> <kbd>Spasi</kbd></dt><dd>Berikutnya</dd>
          <dt><kbd>&larr;</kbd></dt><dd>Sebelumnya</dd>
          <dt><kbd>1</kbd>&ndash;<kbd>6</kbd></dt><dd>Lompat ke bab</dd>
          <dt><kbd>P</kbd></dt><dd>Mulai atau jeda simulasi</dd>
          <dt><kbd>S</kbd></dt><dd>Maju satu langkah simulasi</dd>
          <dt><kbd>R</kbd></dt><dd>Reset simulasi</dd>
          <dt><kbd>N</kbd></dt><dd>Catatan presenter</dd>
          <dt><kbd>F</kbd></dt><dd>Layar penuh</dd>
        </dl>
      </div>
    </div>
  </div>

  <!-- Dual-mode Offline Loader: works via file:// double-click AND http(s):// ES Modules -->
  <script>
    (function () {
      var script = document.createElement('script');
      if (window.location.protocol === 'file:') {
        script.src = './public/app.bundle.js';
      } else {
        script.type = 'module';
        script.src = './src/main.js';
      }
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
